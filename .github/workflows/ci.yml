name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby-version: ['3.4.1']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Install dependencies
        run: bundle install

  sast:
    runs-on: ubuntu-24.04
    needs: build # Runs right after build completes
    strategy:
      matrix:
        ruby-version: ['3.4.1']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: Install Brakeman
        run: gem install brakeman -v 5.2.1
      - name: Run Brakeman SAST scan
        run: brakeman -i config/brakeman.ignore -f json | tee result.json
      - name: Upload Brakeman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brakeman-security-report
          path: result.json
        continue-on-error: true

  test:
    runs-on: ubuntu-24.04
    needs: [build, sast]
    strategy:
      matrix:
        ruby-version: ['3.4.1']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Setup database
        run: |
          RAILS_ENV=test bundle exec rails db:create
          RAILS_ENV=test bundle exec rails db:migrate
      - name: Run tests
        env:
          RAILSGOAT_MAINTAINER: true
        run: bundle exec rspec
